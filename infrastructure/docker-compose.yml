services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: price_action
      POSTGRES_USER: price_action
      POSTGRES_PASSWORD: price_action
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U price_action"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  backend:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://price_action:price_action@postgres:5432/price_action
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      IBKR_HOST: host.docker.internal
      IBKR_PORT: ${IBKR_PORT:-7497}
      IBKR_CLIENT_ID: ${IBKR_CLIENT_ID:-17}
      IBKR_READONLY: "true"
      IBKR_MARKET_DATA_TYPE: ${IBKR_MARKET_DATA_TYPE:-3}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  worker:
    build: ../backend
    command: rq worker price-action --url redis://redis:6379/0
    environment:
      DATABASE_URL: postgresql+psycopg://price_action:price_action@postgres:5432/price_action
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
      - redis

  frontend:
    build: ../frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  redis_data:
