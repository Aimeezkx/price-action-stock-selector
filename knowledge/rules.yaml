version: 1
timeframe: 1d
source: "resource/视频教程的 课件幻灯片.pdf (local source, not redistributed)"
rules:
  - id: trend_continuation_pullback
    conditions: [ema20_rising, close_above_ema20, pullback_within_atr, strong_close]
    risk: {stop: below_signal_or_ema, target: 2R}
  - id: resistance_breakout_volume
    conditions: [close_above_40d_resistance, volume_ratio_gte_1_4, close_near_high]
    risk: {stop: below_breakout_level, target: 2R}
  - id: breakout_pullback_support
    conditions: [prior_breakout, retest_holds_level, rejection_close]
    risk: {stop: below_retest_zone, target: 2R}
  - id: tight_range_breakout
    conditions: [seven_day_compression, close_above_range, volume_expansion]
    risk: {stop: below_compression_range, target: 2R}
  - id: pin_bar_key_level
    conditions: [lower_wick_gte_2x_body, close_in_upper_35pct, near_20d_support]
    risk: {stop: below_pin_low, target: 2R}
  - id: inside_bar_breakout
    conditions: [inside_bar, close_above_mother_high, volume_not_below_average]
    risk: {stop: below_mother_low, target: 2R}
  - id: false_breakdown_reclaim
    conditions: [low_below_20d_support, close_reclaims_support, strong_close]
    risk: {stop: below_false_break_low, target: 2R}
  - id: high_volume_upper_wick_risk
    conditions: [long_upper_wick, high_volume, extended_from_ema_or_oversized_bar]
    effect: reduce_long_priority
