[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "price-action-stock-selector"
version = "1.0.0"
description = "Daily price-action stock scanner with IBKR integration"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.4,<3",
  "psycopg[binary]>=3.2,<4",
  "ib-insync>=0.9.86,<1",
  "redis>=5,<6",
  "rq>=1.16,<3",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.6,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
